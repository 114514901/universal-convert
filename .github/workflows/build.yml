name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Restore & Build
        run: msbuild UniversalConvert.sln /p:Configuration=Release /restore /m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-convert-build
          path: |
            src/**/bin/Release/**
            plugins/**/bin/Release/**
