name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Build
        run: msbuild UniversalConvert.sln /p:Configuration=Release /restore /m

      # 构建时拉取 ffmpeg 并打入安装包（GPL 版以支持默认 libx264；对外分发需遵守 GPL）
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          New-Item -ItemType Directory -Force $dir | Out-Null
          tar -xf $zip -C $dir
          $bin = (Get-ChildItem -Path $dir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force dist\tools | Out-Null
          Copy-Item (Join-Path $bin "ffmpeg.exe") dist\tools\ -Force
          Copy-Item (Join-Path $bin "ffprobe.exe") dist\tools\ -Force

      - name: Assemble dist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\plugins | Out-Null
          Copy-Item "src\UniversalConvert.App\bin\Release\net48\*" "dist\" -Recurse -Force
          Copy-Item "src\UniversalConvert.ContextMenu\bin\Release\net48\UniversalConvert.ContextMenu.dll" "dist\" -Force
          Copy-Item "src\UniversalConvert.ContextMenu\bin\Release\net48\SharpShell.dll" "dist\" -Force
          Copy-Item "src\UniversalConvert.Installer\bin\Release\net48\UniversalConvert.Installer.exe" "dist\" -Force
          Copy-Item "plugins\UniversalConvert.Plugin.FFmpeg\bin\Release\net48\UniversalConvert.Plugin.FFmpeg.dll" "dist\plugins\" -Force
          Copy-Item "plugins\UniversalConvert.Plugin.Ncm\bin\Release\net48\UniversalConvert.Plugin.Ncm.dll" "dist\plugins\" -Force
          Copy-Item "plugins\UniversalConvert.Plugin.Kgm\bin\Release\net48\UniversalConvert.Plugin.Kgm.dll" "dist\plugins\" -Force

      - name: Decompress KGM key table
        shell: pwsh
        run: |
          python -c "import lzma; open('dist/plugins/kugou_key.dat','wb').write(lzma.open('plugins/UniversalConvert.Plugin.Kgm/kugou_key.xz','rb').read())"
          Get-Item dist\plugins\kugou_key.dat | Select-Object Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        working-directory: packaging
        run: |
          $ver = "1.0.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "UniversalConvert.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UniversalConvert-Setup
          path: output/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.exe
          generate_release_notes: true
