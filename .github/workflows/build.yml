name: build

on:
  push:
    branches: [ main, feature/v2.0 ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Set version
        shell: pwsh
        run: |
          $ver = "2.9.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") { $ver = $env:GITHUB_REF_NAME.TrimStart("v") }
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Build
        run: msbuild UniversalConvert.sln /p:Configuration=Release /restore /m /p:Version=${{ env.VERSION }}

      - name: Run CLI tests
        shell: pwsh
        run: |
          & "tests\UniversalConvert.Tests\bin\Release\net48\UniversalConvert.Tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 构建时拉取 ffmpeg 并打入安装包（GPL 版以支持默认 libx264；对外分发需遵守 GPL）
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
          # 固定到可复现的 autobuild 版本，并校验 SHA256；升级 FFmpeg 时需同步更新以下三项。
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-16-13-04/ffmpeg-N-127579-g5cb9fcd211-win64-gpl.zip"
          $ffmpegSha256 = "b7c94a054ae4c1cce0e11ae18979d932e6f129ba6f5253b328227b31f1bf2bbf"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zip
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $ffmpegSha256) {
              throw "FFmpeg 下载包 SHA256 校验失败：期望 $ffmpegSha256，实际 $actualSha256"
          }
          New-Item -ItemType Directory -Force $dir | Out-Null
          tar -xf $zip -C $dir
          $bin = (Get-ChildItem -Path $dir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).DirectoryName
          # 打印打包的 ffmpeg 版本（master 滚动快照，便于追溯每个 release 的版本/安全修复状态）
          Write-Host "===== 打包 ffmpeg 版本 ====="
          & (Join-Path $bin "ffmpeg.exe") -version | Select-Object -First 1
          Write-Host "============================="
          New-Item -ItemType Directory -Force dist\tools | Out-Null
          Copy-Item (Join-Path $bin "ffmpeg.exe") dist\tools\ -Force
          Copy-Item (Join-Path $bin "ffprobe.exe") dist\tools\ -Force

      - name: Assemble dist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\plugins | Out-Null
          Copy-Item "src\UniversalConvert.App\bin\Release\net48\*" "dist\" -Recurse -Force
          Copy-Item "src\UniversalConvert.Watchdog\bin\Release\net48\UniversalConvert.Watchdog.exe" "dist\" -Force
          Copy-Item "src\UniversalConvert.ContextMenu\bin\Release\net48\UniversalConvert.ContextMenu.dll" "dist\" -Force
          Copy-Item "src\UniversalConvert.ContextMenu\bin\Release\net48\SharpShell.dll" "dist\" -Force
          Copy-Item "src\UniversalConvert.Installer\bin\Release\net48\UniversalConvert.Installer.exe" "dist\" -Force
          Copy-Item "src\UniversalConvert.Cli\bin\Release\net48\UniversalConvert.Cli.exe" "dist\" -Force
          Copy-Item "src\UniversalConvert.Updater\bin\Release\net48\UniversalConvert.Updater.exe" "dist\" -Force
          Copy-Item "plugins\UniversalConvert.Plugin.FFmpeg\bin\Release\net48\UniversalConvert.Plugin.FFmpeg.dll" "dist\plugins\" -Force
          Copy-Item "plugins\UniversalConvert.Plugin.Ncm\bin\Release\net48\UniversalConvert.Plugin.Ncm.dll" "dist\plugins\" -Force
          Copy-Item "plugins\UniversalConvert.Plugin.Qmc\bin\Release\net48\UniversalConvert.Plugin.Qmc.dll" "dist\plugins\" -Force

      # 打包 Core SDK，供扩展仓库（universal-convert-extensions）编译插件时引用
      - name: Package Core SDK
        shell: pwsh
        run: |
          Compress-Archive -Path "src\UniversalConvert.Core\bin\Release\net48\UniversalConvert.Core.dll", "src\UniversalConvert.Core\bin\Release\net48\Newtonsoft.Json.dll" -DestinationPath "UniversalConvert.Core.SDK.zip"
          Get-Item UniversalConvert.Core.SDK.zip | Select-Object Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        working-directory: packaging
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "UniversalConvert.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UniversalConvert-Setup
          path: output/*.exe

      - name: Extract changelog
        shell: pwsh
        run: python scripts/extract_changelog.py $env:VERSION

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/*.exe
            UniversalConvert.Core.SDK.zip
          body_path: changelog_entry.md
          prerelease: ${{ contains(github.ref_name, '-') }}
